[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpc-adtech-lakehouse"
version = "0.1.0"
description = "Near Real-Time CPC AdTech Lakehouse on Windows/WSL2 & MinIO"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "confluent-kafka>=2.6.0",
    "dbt-core==1.11.17",
    "dbt-duckdb==1.11.1",
    "duckdb>=1.2.0",
    "jsonschema>=4.23.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "spark: mark test as requiring a running Spark session",
    "integration: mark test as requiring external services (Redpanda, MinIO)",
]
